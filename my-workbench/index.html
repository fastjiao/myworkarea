<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 内容安全策略：只允许加载本地脚本与样式，提升安全性 -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; media-src 'self' http: https:;">
  <title>教公台-阡稻工作室</title>
  <!-- 引入全局样式 -->
  <link rel="stylesheet" href="styles.css">
</head>

<body data-theme="light">

  <!--
    科技感背景层（z-index 位于最底层，内容区在其上方）：
    - 渐变蓝灰背景墙
    - 全息几何网格线
    - 微光粒子 + 动态数据流 canvas
  -->
  <div class="tech-backdrop" aria-hidden="true">
    <div class="tech-grid"></div>
    <canvas id="fx-canvas" class="fx-canvas"></canvas>
  </div>

  <!-- 应用整体布局：左侧固定侧边栏 + 右侧主内容区 -->
  <div class="app-layout">

    <!-- ===================== 左侧侧边栏 ===================== -->
    <aside class="sidebar">
      <!-- 品牌标识 -->
      <div class="sidebar-brand">教公台-阡稻工作室</div>

      <!-- 导航菜单：data-page 属性关联对应页面，data-icon 关联 SVG 图标 -->
      <nav class="sidebar-nav">
        <button class="nav-item active" data-page="dashboard">
          <span class="nav-icon" data-icon="home"></span>
          <span class="nav-label">首页</span>
        </button>
        <button class="nav-item" data-page="home">
          <span class="nav-icon" data-icon="app"></span>
          <span class="nav-label">快捷启动</span>
        </button>
        <button class="nav-item" data-page="sign">
          <span class="nav-icon" data-icon="flag"></span>
          <span class="nav-label">一键签到</span>
        </button>
        <button class="nav-item" data-page="calendar">
          <span class="nav-icon" data-icon="calendar"></span>
          <span class="nav-label">日历</span>
        </button>
        <button class="nav-item" data-page="skill-finder">
          <span class="nav-icon" data-icon="compass"></span>
          <span class="nav-label">技能发现</span>
        </button>
        <button class="nav-item" data-page="skills">
          <span class="nav-icon" data-icon="search"></span>
          <span class="nav-label">全部技能</span>
        </button>
        <button class="nav-item" data-page="netease">
          <span class="nav-icon" data-icon="music"></span>
          <span class="nav-label">音乐</span>
        </button>

      </nav>

      <!-- 侧边栏底部：主题切换 + 设置入口（点击齿轮打开设置弹窗） -->
      <div class="sidebar-footer">
        <button id="theme-toggle" class="theme-toggle">暗色模式</button>
        <button id="settings-btn" class="settings-btn" title="设置" aria-label="打开设置">
          <span id="settings-icon"></span>
        </button>
      </div>
    </aside>

    <!-- ===================== 右侧主内容区 ===================== -->
    <div class="main-area">
      <main class="app-main">
        <!-- 页面容器，内容由对应模块 JS 动态渲染 -->
        <section id="page-dashboard" class="page active"></section>
        <section id="page-home" class="page"></section>
        <section id="page-calendar" class="page"></section>
        <section id="page-skills" class="page"></section>
        <section id="page-skill-finder" class="page"></section>
        <section id="page-sign" class="page"></section>
        <section id="page-netease" class="page"></section>
      </main>
    </div>
  </div>

  <!-- ===================== 右上角时钟组件 =====================
       模式 A（默认）：圆形模拟时钟；模式 B：数字时钟 HH:MM:SS
       点击 / 回车切换，指针旋转由 CSS transform: rotate() 驱动
       🔴 -webkit-app-region: no-drag 保证时钟在自己区域内可点击，
          不影响标题栏其余部分的拖拽（若未来启用无边框拖拽布局）
  -->
  <div id="clock-widget" class="clock-widget" data-mode="analog"
       role="button" tabindex="0" aria-label=""
       title="">
    <!-- 模式 A：模拟表盘（刻度与 12/3/6/9 数字由 clock.js 动态生成） -->
    <div class="clock-analog clock-view" aria-hidden="true">
      <div class="clock-hand hand-hour"></div>
      <div class="clock-hand hand-minute"></div>
      <div class="clock-hand hand-second"></div>
      <div class="clock-center"></div>
    </div>
    <!-- 模式 B：数字时钟（如不需要下方日期行，删除 clock-digital-date 一行即可） -->
    <div class="clock-digital clock-view" aria-hidden="true">
      <div class="clock-digital-time">
        <span id="clock-dh">00</span><span class="clock-colon">:</span><span id="clock-dm">00</span><span class="clock-colon">:</span><span id="clock-ds">00</span>
      </div>
      <div class="clock-digital-date" id="clock-date"></div>
    </div>
  </div>

  <!-- 通用模态框：内容由 JS 动态填充，供添加/编辑表单复用 -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title"></h2>
        <button id="modal-close" class="modal-close" title="关闭"></button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- 右键菜单：用于打开 / 删除快捷方式 -->
  <div id="context-menu" class="context-menu" hidden>
    <ul>
      <li id="menu-open">打开</li>
      <li id="menu-edit">修改</li>
      <li id="menu-remove" class="danger">删除</li>
      <li id="menu-property">属性</li>
    </ul>
  </div>

  <!--
    脚本加载顺序说明：
    模块文件先加载，只在顶层向 window 挂载对象；
    renderer.js 最后加载，定义 Store / UI 工具并触发各模块初始化。
  -->
  <script src="modules/icons.js"></script>
  <script src="modules/dashboard.js"></script>
  <script src="modules/home.js"></script>
  <script src="modules/calendar.js"></script>
  <script src="modules/skills.js"></script>
  <script src="modules/skill-finder.js"></script>
  <script src="modules/sign.js"></script>
  <script src="modules/netease.js"></script>
  <script src="modules/clock.js"></script>
  <script src="modules/settings.js"></script>
  <script src="renderer.js"></script>
</body>

</html>
